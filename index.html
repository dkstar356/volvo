<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volvo IPTV Mockup</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 화면 컨테이너: 원본 이미지 1536x1024 비율을 완벽하게 고정 */
    .screen-container {
      position: relative;
      display: none;
      width: min(100vw, calc(100vh * (1536 / 1024)));
      height: min(100vh, calc(100vw * (1024 / 1536)));
      aspect-ratio: 1536 / 1024;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }

    .screen-container.active {
      display: block;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* 배경 이미지 */
    .bg-img {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none; /* 클릭 이벤트가 핫스팟으로 통과하도록 함 */
    }

    /* ----------------------------------
       클릭 영역 (핫스팟) 공통 스타일
    ---------------------------------- */
    .clickable-area {
      position: absolute;
      cursor: pointer;
      z-index: 999;
      /* 클릭 위치 확인용 가이드 (필요 시 아래 2줄 삭제 가능) */
      background-color: rgba(255, 255, 255, 0.01);
      transition: background-color 0.15s, outline 0.15s;
    }

    /* 마우스 호버 시 버튼 위치 하이라이트 */
    .clickable-area:hover {
      background-color: rgba(255, 255, 255, 0.25);
      outline: 2px solid rgba(255, 255, 255, 0.8);
    }

    /* ----------------------------------
       1. 홈 화면 버튼 위치 (정확한 좌표)
    ---------------------------------- */
    /* [자세히 보기] 버튼 */
    .btn-detail-area {
      top: 45.9%;
      left: 9.1%;
      width: 11.4%;
      height: 5.2%;
      border-radius: 6px;
    }

    /* [볼보 썸네일 카드] */
    .volvo-thumbnail-area {
      top: 64.4%;
      left: 6.4%;
      width: 16.8%;
      height: 16.1%;
      border-radius: 10px;
    }

    /* ----------------------------------
       2. 상세 화면 버튼 위치 (정확한 좌표)
    ---------------------------------- */
    /* [< 홈] 버튼 */
    .btn-home-area {
      top: 3.2%;
      left: 4.2%;
      width: 5.5%;
      height: 4.5%;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- ====================================
       1. 홈 화면 (Home Screen)
  ==================================== -->
  <div id="home-screen" class="screen-container active">
    <!-- 홈 화면 이미지 -->
    <img class="bg-img" src="./홈화면_볼보.png" alt="홈화면 볼보" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1617788138017-80ad40651399?q=80&w=1920&auto=format&fit=crop';">
    
    <!-- [자세히 보기] 클릭 영역 -->
    <div 
      class="clickable-area btn-detail-area" 
      onclick="navigateTo('detail-screen')" 
      title="상세화면으로 이동">
    </div>

    <!-- [볼보 썸네일 카드] 클릭 영역 -->
    <div 
      class="clickable-area volvo-thumbnail-area" 
      onclick="navigateTo('detail-screen')" 
      title="상세화면으로 이동">
    </div>
  </div>

  <!-- ====================================
       2. 상세 화면 (Detail Screen)
  ==================================== -->
  <div id="detail-screen" class="screen-container">
    <!-- 상세 화면 이미지 -->
    <img class="bg-img" src="./상세화면_볼보.png" alt="상세화면 볼보" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1617788138017-80ad40651399?q=80&w=1920&auto=format&fit=crop';">
    
    <!-- [< 홈] 클릭 영역 -->
    <div 
      class="clickable-area btn-home-area" 
      onclick="navigateTo('home-screen')" 
      title="홈화면으로 이동">
    </div>
  </div>

  <!-- JavaScript: 화면 전환 함수 -->
  <script>
    function navigateTo(targetId) {
      // 모든 화면 비활성화
      const screens = document.querySelectorAll('.screen-container');
      screens.forEach(screen => screen.classList.remove('active'));

      // 지정한 화면 활성화
      const targetScreen = document.getElementById(targetId);
      if (targetScreen) {
        targetScreen.classList.add('active');
      }
    }
  </script>
</body>
</html>
